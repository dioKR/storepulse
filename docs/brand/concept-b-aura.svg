<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <title>storepulse logo concept — gradient pulse wave</title>
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#E24FD8"/>
      <stop offset="1" stop-color="#FF8A5C"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M10 52 C20 52 24 52 30 52 C36 52 36 30 44 30 C52 30 50 70 58 70 C64 70 64 52 70 52 C78 52 82 52 86 52"
        fill="none" stroke="url(#pulse)" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
</svg>
