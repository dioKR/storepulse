<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14">
  <title>storepulse demo — npx storepulse demo renders a release board for every app on both stores</title>
  <rect width="720" height="332" rx="10" fill="#17161A"/>
  <rect x="0.5" y="0.5" width="719" height="331" rx="10" fill="none" stroke="#2E2B33"/>
  <line x1="0" y1="38" x2="720" y2="38" stroke="#2E2B33"/>
  <rect x="16" y="15" width="9" height="9" fill="#E24FD8"/>
  <rect x="31" y="15" width="9" height="9" fill="#46414F"/>
  <rect x="46" y="15" width="9" height="9" fill="#46414F"/>
  <text x="64" y="24" fill="#8F879A" font-size="12">~/work — zsh</text>

  <rect width="0" height="0" fill="none"><animate id="loop" attributeName="width" values="0;0" dur="7.9s" repeatCount="indefinite"/></rect>

  <text x="28" y="68" xml:space="preserve"><tspan fill="#E24FD8" font-weight="700">$ </tspan></text>
  <clipPath id="typeclip"><rect x="45" y="52" width="0" height="22"><animate attributeName="width" to="0" dur="0.01s" begin="loop.begin" fill="freeze"/><animate attributeName="width" calcMode="discrete" values="0;8;17;25;34;42;51;59;67;76;84;93;101;109;118;126;135;143;152;160" dur="2.3s" begin="loop.begin+0.7s" fill="freeze"/></rect></clipPath>
  <text x="45" y="68" fill="#ECE8EE" xml:space="preserve" textLength="160" lengthAdjust="spacing" clip-path="url(#typeclip)">npx storepulse demo</text>
  <rect y="55" width="8" height="16" fill="#E24FD8">
    <animate attributeName="x" to="47" dur="0.01s" begin="loop.begin" fill="freeze"/><animate attributeName="x" calcMode="discrete" values="47;55;64;72;81;89;98;106;114;123;131;140;148;156;165;173;182;190;199;207" dur="2.3s" begin="loop.begin+0.7s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

