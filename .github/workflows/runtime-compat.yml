# Deno와 Bun에서 JSR이 내보내는 TypeScript 원본을 실제로 import·실행한다.
name: Runtime compatibility

on:
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - ".github/workflows/runtime-compat.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "packages/core/**"
      - ".github/workflows/runtime-compat.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: runtime-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno:
    name: Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - run: pnpm install --frozen-lockfile
      # package.json 기반 TypeScript는 .js 상대 import를 사용하므로 JSR 발행과 같은 해석을 쓴다.
      - run: deno run --unstable-sloppy-imports --no-lock packages/core/runtime-smoke.ts

  bun:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: pnpm install --frozen-lockfile
      - run: bun run packages/core/runtime-smoke.ts
